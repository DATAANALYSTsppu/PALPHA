version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: polymarket-db
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: polymarket_dev
      POSTGRES_DB: polymarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
